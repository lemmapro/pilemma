<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pilemma</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(88vw, 650px);
      margin: 60px auto 100px;
    }

    .hero {
      display: block;
      width: 100%;
      height: auto;
    }

    .dictionary {
      margin-top: 42px;
      max-width: 590px;
    }

    .word {
      margin: 0 0 6px;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .meta {
      margin-bottom: 28px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .meta em {
      margin-left: 8px;
    }

    .definitions {
      margin: 0;
      padding-left: 1.55rem;
    }

    .definitions li {
      margin-bottom: 14px;
      padding-left: 0.3rem;
      line-height: 1.55;
    }

    .dictionary a {
      color: #c96f24;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .dictionary a:hover {
      opacity: 0.65;
    }

    @media (max-width: 600px) {
      .page {
        width: 90vw;
        margin-top: 28px;
        margin-bottom: 70px;
      }

      .dictionary {
        margin-top: 32px;
      }

      .word {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      src="hello.jpg"
      alt="Pilemma"
      class="hero"
    >

    <section class="dictionary">

      <h1 class="word">pilemma</h1>

      <div class="meta">
        /piːˈlɛmə/ <em>noun</em>
      </div>

      <ol class="definitions">

        <li>
          a pile of <a
            href="https://en.wiktionary.org/wiki/lemma"
            target="_blank"
            rel="noopener noreferrer"
          >lemmas</a> for things noticed, drawn, or thought about.
        </li>

        <li>
          a.k.a. <strong>π-lemma</strong>: an irrational version of a dilemma.
        </li>

        <li>
          cf. <strong>필름</strong> (<em>pilleum</em>), “film.”
        </li>

      </ol>

    </section>

  </main>

</body>
</html>
