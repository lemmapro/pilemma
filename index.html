<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pilemma</title>

  <!-- Alegreya SC + Afacad -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400;0,500;0,600;1,400&family=Alegreya+SC:wght@500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #151515;
      font-family: "Afacad", sans-serif;
    }

    .page {
      width: min(88vw, 650px);
      margin: 42px auto 110px;
    }

    /* ---------- opening ---------- */

    .opening {
      min-height: 100vh;
    }

    .word {
      margin: 28px 0 4px;
      font-family: "Alegreya SC", serif;
      font-size: clamp(3rem, 7vw, 4.6rem);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: 0.012em;
    }

    .image-wrap {
      display: flex;
      justify-content: center;
    }

    .image-stack {
      position: relative;
      width: 100%;
      cursor: zoom-in;
    }

    .hero {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-color {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .image-stack:hover .hero-color {
        opacity: 1;
      }
    }

    .image-stack.show-color .hero-color {
      opacity: 1;
    }

    /* ---------- image zoom ---------- */

    .zoom-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.96);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
      z-index: 50;
    }

    .zoom-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .image-stack.zoomed {
      position: fixed;
      z-index: 100;
      top: 50%;
      left: 50%;
      width: min(92vw, 900px);
      max-height: 92vh;
      transform: translate(-50%, -50%);
      cursor: zoom-out;
    }

    .image-stack.zoomed .hero {
      max-height: 92vh;
      object-fit: contain;
    }

    /* ---------- dictionary ---------- */

    .dictionary {
      max-width: 620px;
      padding-top: 18px;
    }

    .meta {
      margin-bottom: 0;
      font-size: 1.38rem;
      line-height: 1.28;
      color: #3f3f3f;
    }

    .meta .noun {
      margin-left: 8px;
      font-style: italic;
    }

    .ipa {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 0.88em;
    }

    .pi-symbol {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 0.86em;
      font-weight: 600;
    }

    .definitions {
      margin: 0;
      padding-left: 1.7rem;
      font-size: 1.42rem;
      line-height: 1.38;
    }

    .definitions li {
      padding-left: 0.35rem;
      margin-bottom: 6px;
    }

    .dictionary a {
      color: #c96f24;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .dictionary a:hover {
      opacity: 0.65;
    }

    /* Korean: a quieter bookish face that fits the dictionary mood */
    .ko {
      font-family: "Noto Serif KR", serif;
      font-weight: 500;
      font-size: 0.84em;
      letter-spacing: -0.015em;
    }

    @media (max-width: 600px) {
      .page {
        width: 90vw;
        margin-top: 26px;
        margin-bottom: 70px;
      }

      .opening {
        min-height: auto;
      }

      .dictionary {
        padding-top: 30px;
      }

      .word {
        margin-top: 30px;
        margin-bottom: 3px;
        font-size: clamp(2.8rem, 14vw, 4rem);
      }

      .meta {
        font-size: 1.28rem;
      }

      .definitions {
        font-size: 1.3rem;
        padding-left: 1.55rem;
      }
    }
  </style>
</head>

<body>

  <div class="zoom-backdrop" id="zoomBackdrop"></div>

  <main class="page">

    <!-- First screen: photograph, then the word -->
    <section class="opening">
      <div class="image-wrap">
        <div class="image-stack" id="heroImage">
          <img
            src="hello.jpg"
            alt="Pilemma"
            class="hero hero-bw"
          >
          <img
            src="world.jpg"
            alt=""
            class="hero hero-color"
            aria-hidden="true"
          >
        </div>
      </div>

      <h1 class="word">pilemma</h1>

      <div class="meta">
        <span class="ipa">/piːˈlɛmə/</span>
        <span class="noun">noun</span>
      </div>
    </section>

    <!-- Scroll down for the dictionary entry -->
    <section class="dictionary">

      <ol class="definitions">
        <li>
          a pile of <a
            href="https://en.wiktionary.org/wiki/lemma"
            target="_blank"
            rel="noopener noreferrer"
          >lemmas</a> for things noticed, drawn, or thought about.
        </li>

        <li>
          a.k.a. <strong><span class="pi-symbol">π</span>-lemma</strong>: an irrational version of a dilemma.
        </li>

        <li>
          cf. <span class="ko">필름</span> (<em>pilleum</em>), “film.”
        </li>
      </ol>

    </section>

  </main>

  <script>
    const image = document.getElementById("heroImage");
    const backdrop = document.getElementById("zoomBackdrop");
    const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    function toggleZoom() {
      const isZoomed = image.classList.toggle("zoomed");
      backdrop.classList.toggle("active", isZoomed);
    }

    function closeZoom() {
      image.classList.remove("zoomed");
      backdrop.classList.remove("active");
    }

    image.addEventListener("dblclick", toggleZoom);

    if (!canHover) {
      image.addEventListener("click", function() {
        image.classList.toggle("show-color");
      });
    }

    backdrop.addEventListener("click", closeZoom);

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeZoom();
      }
    });
  </script>

</body>
</html>
